<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Health Dashboard technical architecture</title>
  <desc id="desc">Left-to-right flow from optional Windows launcher and browser UI through a loopback Node.js HTTP server to configuration and local health-data files, with browser localStorage backup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .title{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.subtitle{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.cardTitle{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.cardText{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.label{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}.icon{stroke:#0f4c5c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.accent{fill:#e8f2f4;stroke:#9cc0c8;stroke-width:1.5}.data{fill:#fff7ed;stroke:#fdba74;stroke-width:1.5}.note{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="82" class="title">Health Dashboard Architecture</text>
  <text x="90" y="118" class="subtitle">Local-first browser application • Node.js standard library • JSON persistence • default loopback boundary</text>

  <rect x="90" y="200" width="330" height="190" rx="24" class="card"/>
  <rect x="118" y="228" width="58" height="58" rx="15" class="accent"/>
  <rect x="132" y="240" width="30" height="22" rx="3" class="icon"/><path d="M139 270h16M147 262v8" class="icon"/>
  <text x="198" y="254" class="cardTitle">Browser UI</text>
  <text x="118" y="315" class="cardText">index.html • app.js • styles.css</text>
  <text x="118" y="345" class="cardText">Schedule, metrics, calendar, progress</text>
  <text x="118" y="375" class="cardText">Same-origin JSON requests</text>

  <rect x="90" y="500" width="330" height="145" rx="24" class="card"/>
  <rect x="118" y="526" width="58" height="58" rx="15" class="accent"/>
  <path d="M132 548h30v22h-30zM138 542h18" class="icon"/>
  <text x="198" y="552" class="cardTitle">Windows launcher</text>
  <text x="118" y="610" class="cardText">Optional • port 3003 • Node/WSL discovery</text>

  <rect x="575" y="245" width="390" height="250" rx="26" class="card"/>
  <rect x="607" y="275" width="62" height="62" rx="16" class="accent"/>
  <path d="M622 292h32v28h-32zM629 285h18M629 327h18" class="icon"/>
  <text x="695" y="303" class="cardTitle">Node.js HTTP server</text>
  <text x="607" y="365" class="cardText">server.js • no third-party packages</text>
  <text x="607" y="397" class="cardText">127.0.0.1:3000 by default</text>
  <text x="607" y="429" class="cardText">Static files + /api/state + /api/config</text>
  <text x="607" y="461" class="cardText">/api/import • normalization • security headers</text>

  <rect x="1110" y="165" width="380" height="150" rx="24" class="card"/>
  <rect x="1138" y="192" width="56" height="56" rx="14" class="data"/>
  <path d="M1152 202h28v36h-28zM1158 210h16M1158 219h16M1158 228h10" class="icon"/>
  <text x="1215" y="219" class="cardTitle">config.json</text>
  <text x="1138" y="278" class="cardText">Schedule • exercises • formulas • theme</text>

  <rect x="1110" y="370" width="380" height="165" rx="24" class="card"/>
  <rect x="1138" y="397" width="56" height="56" rx="14" class="data"/>
  <ellipse cx="1166" cy="408" rx="17" ry="7" class="icon"/><path d="M1149 408v28c0 4 8 7 17 7s17-3 17-7v-28M1149 422c0 4 8 7 17 7s17-3 17-7" class="icon"/>
  <text x="1215" y="424" class="cardTitle">data/health.json</text>
  <text x="1138" y="486" class="cardText">Workouts • body metrics • profile • dates</text>
  <text x="1138" y="516" class="cardText">Sensitive runtime data • Git-ignored</text>

  <rect x="1110" y="590" width="380" height="150" rx="24" class="card"/>
  <rect x="1138" y="617" width="56" height="56" rx="14" class="data"/>
  <path d="M1151 627h30v30h-30zM1157 621h18M1157 663h18" class="icon"/>
  <text x="1215" y="644" class="cardTitle">health.backup.json</text>
  <text x="1138" y="703" class="cardText">Backup written with state updates</text>

  <rect x="555" y="620" width="430" height="150" rx="24" class="card"/>
  <rect x="585" y="647" width="56" height="56" rx="14" class="note"/>
  <path d="M599 660h28v29h-28zM605 654h16" class="icon"/>
  <text x="665" y="674" class="cardTitle">Browser localStorage</text>
  <text x="585" y="731" class="cardText">Client/config recovery copies • also sensitive</text>

  <path d="M420 292H575" class="line"/>
  <text x="453" y="275" class="label">HTTP / JSON</text>
  <path d="M420 572C500 572 510 500 610 485" class="dash"/>
  <text x="447" y="548" class="label">starts / probes</text>
  <path d="M965 335C1030 300 1040 250 1110 240" class="line"/>
  <text x="993" y="286" class="label">read / write</text>
  <path d="M965 390H1110" class="line"/>
  <text x="996" y="373" class="label">state</text>
  <path d="M965 440C1040 480 1040 645 1110 660" class="line"/>
  <text x="998" y="529" class="label">backup</text>
  <path d="M255 390C255 690 410 695 555 695" class="dash"/>
  <text x="300" y="676" class="label">browser backup</text>

  <rect x="90" y="800" width="1400" height="58" rx="18" class="note"/>
  <text x="118" y="835" class="label">Trust boundary: no application authentication. Keep the default loopback bind unless independent TLS, authentication, firewall, and access controls are added.</text>
</svg>
